<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIS 181 Form Demo</title>
    <link rel="stylesheet" href="forms.css">
</head>

<body>
    <main>
        <h1>CIS 181 Course Interest Form</h1>

        <p>
            This sample form shows how a website can collect information from
            visitors. Each form control has a label so users know what to enter.
        </p>

        <!--
            action="#" keeps this classroom demo on the same page.
            A real website would send the form data to a server for processing.
        -->
        <form>
            <fieldset> 
                <legend> contact information</legend>
                <label for="fname"> first name</label>
                <input type="text" id="fname" name="fname" placeholder="first name"

                <label for="email"> email</label>
                <input type="text" id="email" name="email" placeholder="email"

                <label for="topic"> whcih topic intrest you most?</label>
                <select id="topic" name="topic">
                   <option value="">-- Select a topic --</option>
                   <option value="Html">HTML</option>
                   <option value="css"> CSS</option>
                   <option value="javascript">Javascript</option>
                   <option value="forms">Forms</option> 
                </select>
                
                <p>Which learning format do you prefer?</p>

                <input type="radio" id="inperson" name="format" value="in-person"
                <label for="inperson"> In Person</label>

                
                <input type="radio" id="online" name="format" value="online">
                <label for="online" >Online</label>


 
        </fieldset>
        </form>
    </main>
</body>
</html>
