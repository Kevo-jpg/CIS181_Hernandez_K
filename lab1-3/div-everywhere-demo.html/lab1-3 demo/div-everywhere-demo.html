<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiking Blog — DIV version</title>
  </head>
  <body>
    <!-- Every visible section is a generic div. The page looks fine,
         but its structure is not obvious to browsers or assistive technology. -->
    <div class="header">My Hiking Blog</div>
    <div class="menu">Home &nbsp;|&nbsp; Trails &nbsp;|&nbsp; About</div>
    <div class="content">
      <div class="title">Best trail this weekend</div>
      <div class="text">Bring water, wear layers, and tell someone where you are going.</div>
    </div>
    <div class="bottom">© 2026 My Hiking Blog</div>

    <p><strong>Demo prompt:</strong> Can you tell which div is navigation, the main content, or the footer?</p>
  </body>
</html>
