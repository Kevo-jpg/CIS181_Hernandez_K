<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiking Blog — Semantic HTML version</title>
  </head>
  <body>
    <!-- Same visual design, but the markup now states each section's role. -->
    <header>My Hiking Blog</header>
    <nav aria-label="Primary navigation">Home &nbsp;|&nbsp; Trails &nbsp;|&nbsp; About</nav>
    <main>
      <article>
        <h1>Best trail this weekend</h1>
        <p>Bring water, wear layers, and tell someone where you are going.</p>
      </article>
    </main>
    <footer>© 2026 My Hiking Blog</footer>

    <p><strong>Demo prompt:</strong> Now a browser and screen reader can identify the page landmarks and heading hierarchy.</p>
  </body>
</html>
